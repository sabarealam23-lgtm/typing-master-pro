<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Master Pro - Landscape Mode</title>
  <style>
    /* ==========================================================================
       RESET & BASE THEME
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #020617; /* Deep Slate 950 */
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* ==========================================================================
       WIDE LANDSCAPE CONTAINER (85% - 90% Width, Max-Width 1100px)
       ========================================================================== */
    .app-container {
      width: 88%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Header Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid #1e293b;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #2dd4bf; /* Teal 400 */
      letter-spacing: -0.025em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Timer / Mode Selector Controls */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .mode-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mode-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      margin-right: 0.25rem;
    }

    .btn-mode {
      background-color: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 0.4rem 0.85rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-mode:hover {
      color: #f1f5f9;
      border-color: #475569;
    }

    .btn-mode.active {
      background-color: #2dd4bf;
      color: #020617;
      border-color: #5eead4;
      font-weight: 800;
    }

    .btn-restart {
      background-color: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 0.4rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }

    .btn-restart:hover {
      background-color: #334155;
    }

    /* HUD Stats Grid */
    .stats-hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .stat-card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 800;
      color: #2dd4bf;
    }

    .stat-value.time {
      color: #fbbf24; /* Amber 400 */
    }

    /* ==========================================================================
       PARAGRAPH BOX & TYPING ARENA (WIDE LANDSCAPE LAYOUT)
       ========================================================================== */
    .typing-arena {
      position: relative;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1rem;
      padding: 2rem 2.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      cursor: text;
    }

    /* Off-screen Focus Input */
    .hidden-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    /* Wide Horizontal Paragraph Text Area */
    .text-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 1.35rem;
      line-height: 1.75;
      letter-spacing: 0.04em;
      user-select: none;
      padding: 1.75rem 2.25rem;
      background-color: #020617;
      border: 1px solid #1e293b;
      border-radius: 0.75rem;
      min-height: 160px;
      max-height: 260px;
      overflow-y: auto;
      word-wrap: break-word;
    }

    /* Character Highlighting States */
    .char {
      color: #475569; /* Untyped / Slate 600 */
      transition: all 0.05s ease;
    }

    .char.correct {
      color: #2dd4bf; /* Correct / Teal 400 */
      font-weight: 600;
    }

    .char.incorrect {
      color: #fb7185; /* Incorrect / Rose 400 */
      background-color: rgba(244, 63, 94, 0.2);
      border-radius: 2px;
      text-decoration: underline;
    }

    .char.current {
      background-color: #2dd4bf;
      color: #020617;
      font-weight: 800;
      padding: 0 2px;
      border-radius: 2px;
      animation: pulseCursor 1s infinite alternate;
    }

    @keyframes pulseCursor {
      0% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    .arena-hint {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
    }

    /* Results Summary Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 50;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1rem;
      padding: 2rem;
      width: 90%;
      max-width: 420px;
      text-align: center;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #2dd4bf;
      margin-bottom: 1rem;
    }

    .modal-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 1.5rem 0;
      background-color: #020617;
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid #1e293b;
    }

    .btn-modal-close {
      width: 100%;
      background-color: #2dd4bf;
      color: #020617;
      border: none;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="brand-title">
        ⚡ Typing Master Pro
      </div>
      <div style="font-size: 0.8rem; color: #64748b;">
        Landscape Mode Layout
      </div>
    </header>

    <!-- Timer / Mode Selector Controls -->
    <div class="controls-bar">
      <div class="mode-group">
        <span class="mode-label">Time:</span>
        <button class="btn-mode active" data-time="30">30s</button>
        <button class="btn-mode" data-time="60">60s</button>
        <button class="btn-mode" data-time="120">120s</button>
      </div>

      <button id="restartBtn" class="btn-restart">
        🔄 Restart (Esc)
      </button>
    </div>

    <!-- HUD Stats Bar -->
    <div class="stats-hud">
      <div class="stat-card">
        <span class="stat-label">Speed</span>
        <span id="wpmDisplay" class="stat-value">0 <small style="font-size:0.75rem; color:#64748b;">WPM</small></span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Accuracy</span>
        <span id="accuracyDisplay" class="stat-value">100%</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Time Left</span>
        <span id="timerDisplay" class="stat-value time">30s</span>
      </div>
    </div>

    <!-- Typing Arena Container (Landscape Layout) -->
    <div id="arenaBox" class="typing-arena">
      <input type="text" id="hiddenInput" class="hidden-input" autofocus />
      
      <!-- Wide Paragraph Box -->
      <div id="textDisplay" class="text-display"></div>

      <div class="arena-hint">
        Click inside box or start typing to begin test
      </div>
    </div>
  </div>

  <!-- Results Modal -->
  <div id="resultsModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">🎉 Test Completed!</div>
      <div class="modal-stats">
        <div>
          <div id="finalWpm" style="font-size: 1.75rem; font-weight: 800; color: #2dd4bf;">0</div>
          <div style="font-size: 0.7rem; color: #64748b; font-weight: 700; text-transform: uppercase;">WPM</div>
        </div>
        <div>
          <div id="finalAccuracy" style="font-size: 1.75rem; font-weight: 800; color: #2dd4bf;">100%</div>
          <div style="font-size: 0.7rem; color: #64748b; font-weight: 700; text-transform: uppercase;">Accuracy</div>
        </div>
      </div>
      <button id="closeModalBtn" class="btn-modal-close">Try Again</button>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Sample Passages
    const PASSAGES = [
      "The quick brown fox jumps over the lazy dog. Touch typing is a vital skill that allows developers and writers to output ideas directly to the screen at high velocity.",
      "Consistency and accuracy build typing muscle memory over time. Focus on hitting every single key cleanly before attempting to increase your raw WPM speed.",
      "Modern web software requires speed, precision, and reliable execution. Regular practice sessions of ten minutes daily produce dramatic improvements in typing efficiency."
    ];

    // DOM References
    const hiddenInput = document.getElementById('hiddenInput');
    const textDisplay = document.getElementById('textDisplay');
    const arenaBox = document.getElementById('arenaBox');
    const wpmDisplay = document.getElementById('wpmDisplay');
    const accuracyDisplay = document.getElementById('accuracyDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const restartBtn = document.getElementById('restartBtn');
    const modeButtons = document.querySelectorAll('.btn-mode');
    const resultsModal = document.getElementById('resultsModal');
    const finalWpm = document.getElementById('finalWpm');
    const finalAccuracy = document.getElementById('finalAccuracy');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // State Variables
    let currentPassage = "";
    let selectedTime = 30;
    let timeLeft = 30;
    let timerInterval = null;
    let isActive = false;
    let startTime = null;

    // Initialize Passage Display
    function initTest() {
      clearInterval(timerInterval);
      isActive = false;
      startTime = null;
      timeLeft = selectedTime;
      hiddenInput.value = "";
      
      wpmDisplay.innerHTML = `0 <small style="font-size:0.75rem; color:#64748b;">WPM</small>`;
      accuracyDisplay.textContent = "100%";
      timerDisplay.textContent = `${timeLeft}s`;
      resultsModal.classList.remove('active');

      // Pick Random Passage
      currentPassage = PASSAGES[Math.floor(Math.random() * PASSAGES.length)];
      
      // Render Characters
      textDisplay.innerHTML = "";
      currentPassage.split('').forEach((char, index) => {
        const span = document.createElement('span');
        span.classList.add('char');
        if (index === 0) span.classList.add('current');
        span.textContent = char;
        textDisplay.appendChild(span);
      });

      hiddenInput.focus();
    }

    // Focus Trigger
    arenaBox.addEventListener('click', () => {
      hiddenInput.focus();
    });

    // Handle Input Events
    hiddenInput.addEventListener('input', () => {
      const val = hiddenInput.value;

      // Start Timer on First Keystroke
      if (!isActive && val.length > 0) {
        isActive = true;
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
      }

      // Update Character Highlighting
      const charSpans = textDisplay.querySelectorAll('.char');
      let correctCount = 0;

      charSpans.forEach((span, index) => {
        span.className = 'char'; // Reset state

        if (index < val.length) {
          if (val[index] === currentPassage[index]) {
            span.classList.add('correct');
            correctCount++;
          } else {
            span.classList.add('incorrect');
          }
        } else if (index === val.length) {
          span.classList.add('current');
        }
      });

      // Calculate Stats
      const elapsedSeconds = startTime ? Math.max((Date.now() - startTime) / 1000, 1) : 1;
      const minutes = elapsedSeconds / 60;
      
      // Guard against WPM spikes under 3 seconds
      const calculatedWpm = elapsedSeconds < 3 ? 0 : Math.round((correctCount / 5) / minutes);
      const calculatedAccuracy = val.length > 0 ? Math.round((correctCount / val.length) * 100) : 100;

      wpmDisplay.innerHTML = `${calculatedWpm} <small style="font-size:0.75rem; color:#64748b;">WPM</small>`;
      accuracyDisplay.textContent = `${calculatedAccuracy}%`;

      // Finish if full text typed
      if (val.length >= currentPassage.length) {
        finishTest(calculatedWpm, calculatedAccuracy);
      }
    });

    // Timer Countdown
    function updateTimer() {
      if (timeLeft > 0) {
        timeLeft--;
        timerDisplay.textContent = `${timeLeft}s`;
      } else {
        const val = hiddenInput.value;
        let correctCount = 0;
        for (let i = 0; i < val.length; i++) {
          if (val[i] === currentPassage[i]) correctCount++;
        }
        const minutes = selectedTime / 60;
        const finalWpmVal = Math.round((correctCount / 5) / minutes);
        const finalAccVal = val.length > 0 ? Math.round((correctCount / val.length) * 100) : 100;
        
        finishTest(finalWpmVal, finalAccVal);
      }
    }

    // Finish Test Function
    function finishTest(wpm, accuracy) {
      clearInterval(timerInterval);
      isActive = false;
      hiddenInput.blur();

      finalWpm.textContent = wpm;
      finalAccuracy.textContent = `${accuracy}%`;
      resultsModal.classList.add('active');
    }

    // Mode Selector Handler
    modeButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        modeButtons.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        selectedTime = parseInt(e.target.getAttribute('data-time'), 10);
        initTest();
      });
    });

    // Restart Listeners
    restartBtn.addEventListener('click', initTest);
    closeModalBtn.addEventListener('click', initTest);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        initTest();
      }
    });

    // Initial Load
    initTest();
  </script>
</body>
</html>
